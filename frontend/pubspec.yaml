name: constancy
description: "Constancy App Habit Tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  supabase_flutter: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  intl_utils: ^2.8.7

flutter_intl:
  enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/Logo_Constancy.png
    - assets/images/Logo_Constancy2.png