name: Constancy
description: "Constancy App Habit Tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  supabase_flutter: ^2.8.0
  image_picker: ^1.2.1
  flutter_dotenv: ^5.1.0
  fl_chart: ^0.71.0
  confetti: ^0.7.0
  firebase_core: ^4.9.0
  firebase_messaging: ^16.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.3
  flutter_lints: ^3.0.0
  intl_utils: ^2.8.7
  flutter_launcher_icons: ^0.14.4

flutter_intl:
  enabled: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/Logo_Constancy.png
    - assets/images/Logo_Constancy_Sense_Fons.png
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/Logo_Constancy.png"
  min_sdk_android: 21