name: CI/CD - Firebase App Distribution

on:
  push:
    branches:
      - main

jobs:
  deploy_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JRE
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter pub run intl_utils:generate

      - name: Create dummy .env file
        run: touch .env

      - name: Create firebase_options.dart dynamically
        run: |
          mkdir -p lib
          cat << 'EOF' > lib/firebase_options.dart
          // File generated dynamically by GitHub Actions.
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (defaultTargetPlatform == TargetPlatform.android) return android;
              throw UnsupportedError('Platform not supported in this build.');
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyD0b2Kvo9uLZM6uEdnEC9v3eeMqGNiz7hg',
              appId: '1:155450377472:android:d6d513ac24bd1c89245fe5',
              messagingSenderId: '155450377472',
              projectId: 'constancy-tfg',
              storageBucket: 'constancy-tfg.firebasestorage.app',
            );
          }
          EOF

      - name: Create google-services.json dynamically
        run: |
          mkdir -p android/app
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "155450377472",
              "project_id": "constancy-tfg",
              "storage_bucket": "constancy-tfg.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:155450377472:android:d6d513ac24bd1c89245fe5",
                  "android_client_info": {
                    "package_name": "com.example.constancy"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyD0b2Kvo9uLZM6uEdnEC9v3eeMqGNiz7hg"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Release APK
        run: flutter build apk --release

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload to App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_DISTRIBUTION_TOKEN }}
        run: |
          firebase appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app 1:155450377472:android:d6d513ac24bd1c89245fe5 \
            --groups testers \
            --release-notes "Sincronització automàtica de la branca main"