name: CI/CD - Firebase App Distribution

on:
  push:
    branches:
      - main

jobs:
  deploy_android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JRE
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Create dummy .env file
        run: touch .env

      - name: Build APK and Upload to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_DISTRIBUTION_TOKEN }}
        run: flutter build apk --release --pub --target-platform android-arm,android-arm64,android-x64